<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="35%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="hysteresis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)" />
  <rect width="796" height="796" x="2" y="2" rx="158" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Oscilloscope Display Reticle / Grid -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 8">
    <!-- Horizontal Division Lines -->
    <line x1="120" y1="240" x2="680" y2="240" />
    <line x1="120" y1="320" x2="680" y2="320" />
    <line x1="120" y1="400" x2="680" y2="400" stroke-dasharray="none" stroke-width="2" />
    <line x1="120" y1="480" x2="680" y2="480" />
    <line x1="120" y1="560" x2="680" y2="560" />
    
    <!-- Vertical Division Lines -->
    <line x1="200" y1="160" x2="200" y2="640" />
    <line x1="280" y1="160" x2="280" y2="640" />
    <line x1="360" y1="160" x2="360" y2="640" />
    <line x1="440" y1="160" x2="440" y2="640" stroke-dasharray="none" stroke-width="2" />
    <line x1="520" y1="160" x2="520" y2="640" />
    <line x1="600" y1="160" x2="600" y2="640" />
  </g>

  <!-- Central Scope Boundary Frame -->
  <rect x="120" y="160" width="560" height="480" rx="24" fill="none" stroke="#334155" stroke-width="3" />

  <!-- Hysteresis Threshold Window Band (Schmitt Trigger Concept) -->
  <rect x="120" y="340" width="560" height="120" fill="url(#hysteresis-grad)" />
  <line x1="120" y1="340" x2="680" y2="340" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7" />
  <line x1="120" y1="460" x2="680" y2="460" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7" />

  <!-- Noisy Analog Signal Trace (Fading into digital reconstruction) -->
  <path d="M 120 400 
           Q 145 375, 160 410 
           T 195 385 
           T 230 420 
           T 260 370 
           L 290 440 
           Q 320 400, 340 400" 
        fill="none" 
        stroke="#EC4899" 
        stroke-width="3" 
        opacity="0.45" />

  <!-- Clean Synthesized Square Logic & UART Digital Waveform (Main Hero Element) -->
  <path d="M 140 480 
           L 240 480 
           L 240 280 
           L 360 280 
           L 360 480 
           L 440 480 
           L 440 280 
           L 500 280 
           L 500 480 
           L 580 480 
           L 580 280 
           L 660 280" 
        fill="none" 
        stroke="url(#pulse-grad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Sampling Clock Strobe Points (Logic Analyzer Capture Markers) -->
  <g fill="#38BDF8" filter="url(#soft-glow)">
    <circle cx="240" cy="280" r="7" />
    <circle cx="300" cy="280" r="6" />
    <circle cx="360" cy="280" r="7" />
    <circle cx="440" cy="280" r="7" />
    <circle cx="470" cy="280" r="6" />
    <circle cx="500" cy="280" r="7" />
    <circle cx="580" cy="280" r="7" />
    <circle cx="620" cy="280" r="6" />
    <circle cx="660" cy="280" r="7" />
  </g>

  <!-- Schmitt Trigger Transfer Characteristic Icon in Corner -->
  <g transform="translate(150, 185) scale(0.65)" stroke="#F59E0B" stroke-width="4" fill="none" opacity="0.85">
    <path d="M 0 40 L 30 40 L 30 0 L 70 0" />
    <path d="M 70 20 L 40 20 L 40 60 L 0 60" />
  </g>

  <!-- Brand Typography -->
  <text x="400" y="695" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="4">
    SYNTH<tspan fill="#38BDF8">SCOPE</tspan>
  </text>
  <text x="400" y="728" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="3">
    SOFTWARE-DEFINED LOGIC ANALYZER
  </text>
</svg>
